name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -c requirements.lock -e . --group dev
      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          export POSTGRES_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "CUSTOMEROPS_TEST_DATABASE_URL=postgresql+asyncpg://customerops_test:$POSTGRES_PASSWORD@127.0.0.1:55432/customerops_test" >> "$GITHUB_ENV"
          docker run -d --name customerops-test \
            -e POSTGRES_PASSWORD -e POSTGRES_USER=customerops_test -e POSTGRES_DB=customerops_test \
            -p 127.0.0.1:55432:5432 \
            --health-cmd='pg_isready -U customerops_test -d customerops_test' \
            --health-interval=2s --health-timeout=3s --health-retries=30 \
            postgres:18.6-bookworm
          timeout 90 bash -c 'until [ "$(docker inspect --format="{{.State.Health.Status}}" customerops-test)" = healthy ]; do sleep 2; done'
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest -m "not live" --require-database
      - name: PostgreSQL logs on failure
        if: failure()
        run: docker logs customerops-test
      - name: Stop test database
        if: always()
        run: docker rm -f customerops-test
