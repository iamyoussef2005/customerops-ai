[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "customerops-ai"
version = "0.1.0"
description = "A modular Python backend for an e-commerce customer support AI agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.8,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.31,<1",
    "alembic>=1.14,<2",
    "openai>=3.35.1,<4",
    "chromadb>=1.5.9,<2",
    "pypdf>=6.21.1,<7",
    "python-multipart>=0.0.22,<1",
    "filelock>=3.20,<4",
]

[dependency-groups]
test = [
    "pytest>=8.3,<10",
    "httpx2>=2.16,<3",
    # The current TestClient uses httpx2; older Starlette releases require httpx.
    "starlette>=1.9,<2",
    "pytest-asyncio>=1.3,<2",
]
lint = ["ruff>=0.9,<1"]
typing = ["mypy>=1.14,<2"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typing"},
]

[tool.hatch.build.targets.wheel]
packages = ["src/customerops_ai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "alembic/env.py", "alembic/versions"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Chroma 1.5.9 calls this deprecated stdlib alias on Python 3.14.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.telemetry.opentelemetry",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: requires an explicitly configured isolated PostgreSQL test database",
    "live: opt-in paid OpenAI smoke test, excluded from offline checks",
]
