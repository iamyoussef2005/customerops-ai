name: customerops-ai

x-backend: &backend
  build: .
  image: customerops-ai:local
  environment: &app-environment
    CUSTOMEROPS_ENVIRONMENT: development
    CUSTOMEROPS_DATABASE_HOST: postgres
    CUSTOMEROPS_DATABASE_PORT: "5432"
    CUSTOMEROPS_DATABASE_NAME: ${CUSTOMEROPS_DATABASE_NAME:-customerops}
    CUSTOMEROPS_DATABASE_USER: ${CUSTOMEROPS_DATABASE_USER:-customerops}
    CUSTOMEROPS_DATABASE_PASSWORD: ${CUSTOMEROPS_DATABASE_PASSWORD:?Set CUSTOMEROPS_DATABASE_PASSWORD in .env}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    CUSTOMEROPS_AGENT_MODEL: ${CUSTOMEROPS_AGENT_MODEL:-}
    CUSTOMEROPS_AUTH_TOKEN_CUSTOMERS: ${CUSTOMEROPS_AUTH_TOKEN_CUSTOMERS:-{}}
    CUSTOMEROPS_AUTH_ADMIN_TOKEN_HASHES: ${CUSTOMEROPS_AUTH_ADMIN_TOKEN_HASHES:-[]}
    CUSTOMEROPS_RAG_ENABLED: ${CUSTOMEROPS_RAG_ENABLED:-false}
    CUSTOMEROPS_RAG_STORAGE_PATH: /app/.local/rag
    CUSTOMEROPS_RAG_EMBEDDING_MODEL: ${CUSTOMEROPS_RAG_EMBEDDING_MODEL:-text-embedding-3-small}
    CUSTOMEROPS_RAG_EMBEDDING_DIMENSIONS: ${CUSTOMEROPS_RAG_EMBEDDING_DIMENSIONS:-1536}
    CUSTOMEROPS_RAG_EMBEDDING_BATCH_SIZE: ${CUSTOMEROPS_RAG_EMBEDDING_BATCH_SIZE:-16}
    CUSTOMEROPS_RAG_EMBEDDING_TIMEOUT: ${CUSTOMEROPS_RAG_EMBEDDING_TIMEOUT:-20}
    CUSTOMEROPS_RAG_CHUNK_SIZE: ${CUSTOMEROPS_RAG_CHUNK_SIZE:-1000}
    CUSTOMEROPS_RAG_CHUNK_OVERLAP: ${CUSTOMEROPS_RAG_CHUNK_OVERLAP:-150}
    CUSTOMEROPS_RAG_TOP_K: ${CUSTOMEROPS_RAG_TOP_K:-4}
    CUSTOMEROPS_RAG_MAX_DISTANCE: ${CUSTOMEROPS_RAG_MAX_DISTANCE:-0.35}
    CUSTOMEROPS_RAG_MAX_UPLOAD_BYTES: ${CUSTOMEROPS_RAG_MAX_UPLOAD_BYTES:-5242880}
    CUSTOMEROPS_RAG_MAX_PAGES: ${CUSTOMEROPS_RAG_MAX_PAGES:-100}
    CUSTOMEROPS_RAG_MAX_TEXT_CHARACTERS: ${CUSTOMEROPS_RAG_MAX_TEXT_CHARACTERS:-200000}
    CUSTOMEROPS_RAG_MAX_CHUNKS: ${CUSTOMEROPS_RAG_MAX_CHUNKS:-500}
    CUSTOMEROPS_AGENT_PROVIDER_TIMEOUT: ${CUSTOMEROPS_AGENT_PROVIDER_TIMEOUT:-20}
    CUSTOMEROPS_AGENT_TURN_TIMEOUT: ${CUSTOMEROPS_AGENT_TURN_TIMEOUT:-45}
    CUSTOMEROPS_AGENT_TOOL_TIMEOUT: ${CUSTOMEROPS_AGENT_TOOL_TIMEOUT:-5}
    CUSTOMEROPS_AGENT_MAX_ITERATIONS: ${CUSTOMEROPS_AGENT_MAX_ITERATIONS:-6}
    CUSTOMEROPS_AGENT_MAX_TOOL_CALLS: ${CUSTOMEROPS_AGENT_MAX_TOOL_CALLS:-12}
    CUSTOMEROPS_AGENT_MAX_OUTPUT_TOKENS: ${CUSTOMEROPS_AGENT_MAX_OUTPUT_TOKENS:-1500}
    CUSTOMEROPS_AGENT_HISTORY_MESSAGES: ${CUSTOMEROPS_AGENT_HISTORY_MESSAGES:-20}
    CUSTOMEROPS_MEMORY_HISTORY_MAX_CHARACTERS: ${CUSTOMEROPS_MEMORY_HISTORY_MAX_CHARACTERS:-24000}
    CUSTOMEROPS_MEMORY_HISTORY_MESSAGE_CHARACTERS: ${CUSTOMEROPS_MEMORY_HISTORY_MESSAGE_CHARACTERS:-4000}
    CUSTOMEROPS_MEMORY_SUMMARY_ENABLED: ${CUSTOMEROPS_MEMORY_SUMMARY_ENABLED:-true}
    CUSTOMEROPS_MEMORY_SUMMARY_MAX_CHARACTERS: ${CUSTOMEROPS_MEMORY_SUMMARY_MAX_CHARACTERS:-2000}
    CUSTOMEROPS_MEMORY_SUMMARY_MAX_EXCERPTS: ${CUSTOMEROPS_MEMORY_SUMMARY_MAX_EXCERPTS:-8}
    CUSTOMEROPS_MEMORY_SUMMARY_EXCERPT_CHARACTERS: ${CUSTOMEROPS_MEMORY_SUMMARY_EXCERPT_CHARACTERS:-200}
    CUSTOMEROPS_MEMORY_SUMMARY_SCAN_MESSAGES: ${CUSTOMEROPS_MEMORY_SUMMARY_SCAN_MESSAGES:-200}
    CUSTOMEROPS_MEMORY_PERSIST_TOOL_AUDIT: ${CUSTOMEROPS_MEMORY_PERSIST_TOOL_AUDIT:-true}
    CUSTOMEROPS_MEMORY_MESSAGE_RETENTION_DAYS: ${CUSTOMEROPS_MEMORY_MESSAGE_RETENTION_DAYS:-30}
    CUSTOMEROPS_MEMORY_TOOL_RETENTION_DAYS: ${CUSTOMEROPS_MEMORY_TOOL_RETENTION_DAYS:-7}
    CUSTOMEROPS_MEMORY_CONVERSATION_RETENTION_DAYS: ${CUSTOMEROPS_MEMORY_CONVERSATION_RETENTION_DAYS:-90}
    CUSTOMEROPS_AGENT_TICKETS_PER_HOUR: ${CUSTOMEROPS_AGENT_TICKETS_PER_HOUR:-3}

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${CUSTOMEROPS_DATABASE_USER:-customerops}
      POSTGRES_DB: ${CUSTOMEROPS_DATABASE_NAME:-customerops}
      POSTGRES_PASSWORD: ${CUSTOMEROPS_DATABASE_PASSWORD:?Set CUSTOMEROPS_DATABASE_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.2-trixie
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    volumes:
      - knowledge-data:/app/.local/rag
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  test-postgres:
    image: postgres:18.6-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_USER: customerops_test
      POSTGRES_DB: customerops_test
      POSTGRES_PASSWORD: ${CUSTOMEROPS_TEST_DATABASE_PASSWORD:?Set CUSTOMEROPS_TEST_DATABASE_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customerops_test -d customerops_test"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  knowledge-data:
